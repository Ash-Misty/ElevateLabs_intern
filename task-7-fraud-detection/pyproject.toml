[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "1.0.0"
description = "Credit card fraud detection with Isolation Forest, Local Outlier Factor and XGBoost"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
apps = ["flask>=3.0", "streamlit>=1.40"]
dev = ["ipykernel>=7.0", "jupyter>=1.1", "nbconvert>=7.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
